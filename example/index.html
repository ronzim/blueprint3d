<!DOCTYPE html>
<html>
  <head>
    <title>Blueprint 3D - Example</title>

    <link href="css/bootstrap.css" rel="stylesheet">
    <link href="css/example.css" rel="stylesheet">

    <script src="js/jquery.js"></script>
    <script src="js/bootstrap.js"></script>
    <script type="module" src="js/example.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <div id="app"></div>

    <div class="container-fluid">
      <div class="row main-row">
        <!-- Left Column -->
        <div class="col-xs-3 sidebar">
          <!-- Main Navigation -->
          <div id="side-menu-container"></div>
          <hr />

          <!-- Context Menu -->
          <div id="context-menu-container"></div>

          <!-- Texture Selector -->
          <div id="texture-selector-container"></div>
        </div>

        <!-- Right Column -->
        <div class="col-xs-9 main">

          <!-- 3D Viewer -->
          <div id="viewer">

            <div id="main-controls-container"></div>

            <div id="camera-controls-container"></div>

            <div id="loading-modal-container"></div>
          </div>

          <!-- 2D Floorplanner -->
          <div id="floorplanner">
            <canvas id="floorplanner-canvas"></canvas>
            <div id="floorplanner-controls-container"></div>
            <div id="draw-walls-hint" style="display:none;">
              Press the "Esc" key to stop drawing walls
            </div>
          </div>

          <!-- Add Items -->
          <div id="add-items">
            <div id="vue-add-items"></div>
          </div>
      
        </div>
        <!-- End Right Column -->
      </div>
    </div>

  </body>
</html>
